# `docker compose --profile monitoring up -d` — Prometheus ichki tarmoqda api:8000 dan metrikalarni yig'adi.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: vaksina-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]
