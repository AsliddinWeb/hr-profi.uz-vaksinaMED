[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Uzbek izohlar/matnlar uzun bo'lishi mumkin; uzunlikni formatter nazorat qiladi
ignore = ["E501", "B008"]  # B008: FastAPI Depends() standart uslubi

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
